# ============================================================
# Kitty Workspace Pack v1.6.0 — Fedora / Framework Edition
# Managed by kitty-workspace-pack
# Verified: kitty 0.49.2; check older Fedora builds for feature support
# ============================================================

# ------------------------------------------------------------
# THEME
# ------------------------------------------------------------
include themes/catppuccin-mocha.conf

# ------------------------------------------------------------
# PERSISTENT STATE
# ------------------------------------------------------------

# Every normal kitty start restores the last automatically saved state.
# The installer creates this file from the two-tab baseline on first setup.
startup_session last-state.kitty-session

# Autosave tabs, cwd, titles, layouts and OS-window state approximately every 10 seconds,
# on important events and again on a confirmed normal quit.
watcher state-autosave.py

# Kitty 0.49 remembers maximized state as part of remember_window_size.
remember_window_size yes
# KDE/GNOME on Wayland controls window positioning; forcing a saved position is unreliable.
remember_window_position no

# ------------------------------------------------------------
# LAPTOP APPEARANCE
# ------------------------------------------------------------

# install.sh replaces this marker with JetBrains Mono when available.
# __KITTY_WORKSPACE_FONT__
font_size 11.5
window_padding_width 8
background_opacity 0.97
background_blur 0

cursor_shape beam
cursor_beam_thickness 1.5
cursor_trail 150
cursor_trail_decay 0.1 0.25
cursor_trail_start_threshold 3
mouse_hide_wait -3.0

# ------------------------------------------------------------
# QUIET / PRACTICAL TERMINAL BEHAVIOR
# ------------------------------------------------------------

enable_audio_bell no
confirm_os_window_close -1
scrollback_lines 20000
scrollback_pager_history_size 16
notify_on_cmd_finish invisible 20.0

# Keep manually chosen tab titles stable. Shell integration still reports cwd
# and command boundaries, which are used by state saving and output helpers.
shell_integration no-title

# __KITTY_WORKSPACE_ZSH_SHELL__

# ------------------------------------------------------------
# TABS
# ------------------------------------------------------------

# No project/session filtering anymore: every tab you create remains visible.
drag_threshold 0
map ctrl+shift+.
map ctrl+shift+,

tab_bar_edge top
tab_bar_style powerline
tab_powerline_style round
tab_bar_align left
tab_bar_min_tabs 1
tab_bar_show_new_tab_button yes
tab_title_max_length 20
tab_title_template " {index}: {title} "
active_tab_font_style bold
inactive_tab_font_style normal
tab_activity_symbol "•"

# User-created tabs start in the current cwd and are part of the next autosave.
map ctrl+shift+t new_tab_with_cwd
map ctrl+shift+w close_tab
map ctrl+page_up previous_tab
map ctrl+page_down next_tab

map alt+1 goto_tab 1
map alt+2 goto_tab 2
map alt+3 goto_tab 3
map alt+4 goto_tab 4
map alt+5 goto_tab 5
map alt+6 goto_tab 6
map alt+7 goto_tab 7
map alt+8 goto_tab 8
map alt+9 goto_tab 9

# ------------------------------------------------------------
# TOOL LEADER
# ------------------------------------------------------------
map_timeout 2.0

# Fresh extra OS window. It is included in automatic state persistence too.
map ctrl+space>w new_os_window

# Rename current tab. The watcher picks the new title up automatically.
map ctrl+space>n set_tab_title

# Manual immediate save of the complete current kitty state.
# Normally unnecessary because autosave runs every ~10 seconds.
map ctrl+space>s save_as_session --save-only __KITTY_LAST_STATE__

# Command-output helpers.
map ctrl+space>o show_last_command_output
map ctrl+space>c copy_last_command_output
map ctrl+space>h show_scrollback

map ctrl+space>k command_palette
map ctrl+space>r load_config_file
map ctrl+space>t kitten themes
map ctrl+space>l open_url_with_hints
map ctrl+space>f kitten hints --type path --program -
map ctrl+space>e kitten choose-files
map ctrl+space>d kitten choose-files --mode=dir
map ctrl+space>q kitten quick-access-terminal

# Native shell-integration defaults remain available:
# Ctrl+Shift+G = browse last command output
# Ctrl+Shift+Z = previous shell prompt
# Ctrl+Shift+X = next shell prompt
