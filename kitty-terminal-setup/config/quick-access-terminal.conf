# Kitty Workspace Pack v1.6.0 — Quick Access Terminal

lines 18
edge top
layer overlay
background_opacity 0.94
hide_on_focus_loss yes
app_id kitty-quick-access

# Isolated config: no global autosave watcher. Quick Access must never
# overwrite the persistent main Kitty workspace.
kitty_conf quick-access-kitty.conf

# Keep the drop-down compact on a 14-inch laptop.
kitty_override font_size=11.5
kitty_override window_padding_width=8
kitty_override tab_bar_min_tabs=2

